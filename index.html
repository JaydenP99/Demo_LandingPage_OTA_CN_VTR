    };

  var c=v.c,o='<main style="padding:24px 20px 40px"><div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px"><div style="background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-wrap:wrap"><div style="flex:1 1 360px;min-height:220px;background:#3E6A7A;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;font-size:13px">'+esc(c.about.photo)+'</div><div style="flex:1 1 360px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px"><h1 style="margin:0;font-size:26px;line-height:1.4;white-space:pre-line">'+esc(c.about.title)+'</h1><p style="margin:0;color:#4A5565">'+esc(c.about.sub)+'</p></div></div>';
  o+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px">';
  c.about.stats.forEach(function(s){o+='<div class="box"><div style="font-size:26px;font-weight:700;color:#0A3F8C">'+esc(s.a)+'</div><div class="mt" style="font-size:13px">'+esc(s.b)+'</div></div>';});
  o+='</div><section class="box"><h2 style="margin:0;font-size:18px">'+esc(c.about.licTitle)+'</h2>';
  c.about.lic.forEach(function(l){o+='<span>'+esc(l)+'</span>';});
  o+='</section><section class="box" style="gap:0"><h2 style="margin:0 0 6px;font-size:18px">'+esc(c.about.awardsTitle)+'</h2>';
  c.about.awards.forEach(function(a){o+='<div style="display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 0;border-bottom:1px solid #EEF1F5"><span style="flex:1 1 260px;font-weight:500">'+esc(a.a)+'</span><span class="mt" style="font-size:13px">'+esc(a.b)+'</span></div>';});
  o+='</section><section class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">';
  c.about.safety.forEach(function(s){o+='<div class="box"><span style="font-weight:700">'+esc(s.a)+'</span><span class="mt" style="font-size:13px">'+esc(s.b)+'</span></div>';});
  o+='</section><div style="display:flex;flex-wrap:wrap;gap:12px"><button class="btn or" '+h(v.goTrips)+'>'+esc(c.home.ctaTrips)+'</button><button class="btn gr" '+h(v.openConsult)+'>'+esc(v.consultLabel)+'</button></div></div></main>';
  return o;
}
function vContact(v){
  var c=v.c,f=v.f,o='<main style="padding:24px 20px 40px"><div style="max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px"><h1 style="margin:0;font-size:28px">'+esc(c.contact.title)+'</h1><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">';
  v.channels.forEach(function(ch){o+=chanBtn(ch,false);});
  o+='</div>';
  if(v.formOpen){
    var fld=function(lbl,k,ph,type){return '<label class="f">'+esc(lbl)+'<input class="inp" '+(type?'type="'+type+'" ':'')+'data-field="'+k+'" value="'+esc(f[k])+'" placeholder="'+esc(ph||'')+'"></label>';};
    o+='<form data-submit="1" class="box" style="padding:20px;gap:14px" novalidate><h2 style="margin:0;font-size:18px">'+esc(c.contact.formTitle)+'</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">'+
      fld(c.contact.name+' *','name',c.contact.namePh)+fld(c.contact.contactWay+' *','contact',v.contactPh)+fld(c.contact.date,'date','','date')+fld(c.contact.people,'people',c.contact.peoplePh)+'</div>'+
      fld(c.contact.interest,'interest',c.contact.interestPh)+
      '<label class="f">'+esc(c.contact.note)+'<textarea class="inp" data-field="note" rows="3" placeholder="'+esc(c.contact.notePh)+'" style="height:auto;padding:10px 12px;resize:vertical">'+esc(f.note)+'</textarea></label>'+
      '<label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#4A5565"><input type="checkbox" data-field="agree" '+(f.agree?'checked':'')+' style="margin-top:3px">'+esc(c.contact.consent)+'</label>'+
      (v.formError?'<span role="alert" style="font-size:13px;color:#A3260A">'+esc(v.formErrorText)+'</span>':'')+
      '<button type="submit" class="btn or" style="height:48px">'+esc(c.contact.submit)+'</button></form>';
  }
  if(v.formDone){o+='<div role="status" style="background:#F1F9F4;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px"><span style="font-size:16px;font-weight:700;color:#11683A">'+esc(c.contact.doneTitle)+'</span><span>'+esc(c.contact.doneText)+'</span><button '+h(v.resetForm)+' style="align-self:flex-start;height:40px;padding:0 18px;border:1px solid #11683A;background:#fff;color:#11683A;border-radius:20px">'+esc(c.contact.again)+'</button></div>';}
  o+='<section style="background:#E8F0FB;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font-size:18px;color:#0A3F8C">'+esc(c.contact.bookedTitle)+'</h2><span>'+esc(c.contact.bookedSub)+'</span><div style="display:flex;flex-wrap:wrap;gap:10px"><input class="inp" aria-label="'+esc(c.contact.orderNo)+'" placeholder="'+esc(c.contact.orderNo)+'" style="flex:1 1 200px"><input class="inp" aria-label="'+esc(c.contact.wechatId)+'" placeholder="'+esc(v.contactPh)+'" style="flex:1 1 200px"><button '+h(v.bookedSubmit)+' style="height:44px;padding:0 20px;border:1px solid #0A3F8C;background:#fff;color:#0A3F8C;border-radius:22px">'+esc(c.contact.bookedBtn)+'</button></div></section></div></main>';
  return o;
}

function render(){
  H=[];
  var v=app.renderVals(), c=v.c, s=app.state, o='';
  document.documentElement.lang = s.lang==='tc'?'zh-TW':s.lang==='en'?'en':'zh-CN';
  o+='<div class="draft">'+esc(c.draft)+'</div>';
  o+='<div class="dk" style="background:#0D1F40;color:#C0CCDF;font-size:12px;padding:8px 20px"><div class="wrap" style="display:flex;flex-wrap:wrap;gap:16px"><span style="flex-grow:1">'+esc(c.util)+'</span><span>'+esc(c.hotline)+'</span></div></div>';
  o+='<header style="position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #E3E7ED;padding:10px 20px"><div class="wrap" style="display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center">';
  o+='<button '+h(v.goHome)+' style="border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left"><span style="font-size:26px;font-weight:700;color:#0A3F8C;line-height:1.1">Vietravel</span><span style="font-size:11px;color:#5B6675">'+esc(c.brandTag)+'</span></button>';
  o+='<nav class="dk" style="display:flex;flex-wrap:wrap;gap:4px;flex-grow:1">';
  v.nav.forEach(function(n){o+='<button '+h(n.go)+' style="'+esc(n.style)+'">'+esc(n.label)+'</button>';});
  o+='</nav><div class="mb" style="flex-grow:1"></div>';
  o+='<select class="sel" data-sel="lang" aria-label="Language"><option value="sc"'+(s.lang==='sc'?' selected':'')+'>简体</option><option value="tc"'+(s.lang==='tc'?' selected':'')+'>繁體</option><option value="en"'+(s.lang==='en'?' selected':'')+'>English</option></select>';
  o+='<select class="sel" data-sel="cur" aria-label="Currency"><option value="CNY"'+(s.cur==='CNY'?' selected':'')+'>¥ CNY</option><option value="TWD"'+(s.cur==='TWD'?' selected':'')+'>NT$ TWD</option><option value="HKD"'+(s.cur==='HKD'?' selected':'')+'>HK$ HKD</option></select>';
  o+='<button class="dk gr" '+h(v.openConsult)+' style="height:44px;padding:0 20px;border:0;border-radius:22px;color:#fff;font-weight:500">'+esc(v.consultLabel)+'</button></div></header>';
  var is=v.is;
  o+= is.home?vHome(v): is.trips?vTrips(v): is.detail?vDetail(v): is.deals?vDeals(v): is.guide?vGuide(v): is.article?vArticle(v): is.about?vAbout(v): vContact(v);
  o+='<footer style="background:#0D1F40;color:#C0CCDF;padding:36px 20px 28px"><div class="wrap" style="display:flex;flex-direction:column;gap:24px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:28px;font-size:13px">';
  o+='<div style="display:flex;flex-direction:column;gap:10px"><span style="width:104px;height:104px;border-radius:6px;background:#D9DEE5;color:#4A5565;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center">'+esc(v.qrLabel)+'</span><span style="color:#fff;font-weight:700">'+esc(c.footer.qr)+'</span></div>';
  o+='<div style="display:flex;flex-direction:column;gap:6px"><span style="color:#fff;font-weight:700;font-size:15px">'+esc(c.nav.contact)+'</span><span>'+esc(c.hotline)+'</span><span>'+esc(c.footer.hours)+'</span></div>';
  o+='<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="color:#fff;font-weight:700;font-size:15px">'+esc(c.footer.links)+'</span>';
  v.nav.forEach(function(n){o+='<button '+h(n.go)+' style="border:0;background:transparent;padding:0;color:#C0CCDF;font-size:13px">'+esc(n.label)+'</button>';});
  o+='</div><div style="display:flex;flex-direction:column;gap:6px"><span style="color:#fff;font-weight:700;font-size:15px">'+esc(c.footer.company)+'</span>';
  c.footer.lines.forEach(function(l){o+='<span>'+esc(l)+'</span>';});
  o+='</div></div><span style="font-size:12px;text-align:center">'+esc(c.footer.copy)+'</span></div></footer>';
  o+='<nav class="mb" style="position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid #E3E7ED;height:64px;align-items:stretch">';
  v.tabs.forEach(function(t){o+='<button '+h(t.go)+' style="'+esc(t.style)+'"><span style="'+esc(t.dot)+'"></span>'+esc(t.label)+'</button>';});
  o+='</nav><button class="dk gr" '+h(v.openConsult)+' style="position:fixed;right:20px;bottom:24px;z-index:30;height:52px;padding:0 22px;border:0;border-radius:26px;color:#fff;font-size:15px;font-weight:500;box-shadow:0 4px 14px rgba(13,31,64,.25)">'+esc(v.consultLabel)+'</button>';
  if(v.sheet.consult){
    o+='<div class="overlay"><button '+h(v.closeSheet)+' aria-label="'+esc(c.common.close)+'" style="position:absolute;inset:0;border:0;background:transparent;cursor:default"></button><div class="sheet" role="dialog" aria-modal="true"><div style="display:flex;align-items:center"><span style="flex-grow:1;font-size:18px;font-weight:700">'+esc(c.consult.title)+'</span><button class="x" '+h(v.closeSheet)+' aria-label="'+esc(c.common.close)+'">×</button></div><span class="mt">'+esc(v.hoursText)+'</span>';
    o+='<div class="dk" style="display:flex;gap:14px;align-items:center;background:#F4F6F9;border-radius:12px;padding:12px"><span style="flex:none;width:96px;height:96px;border-radius:6px;background:#D9DEE5;color:#4A5565;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center">'+esc(v.qrLabel)+'</span><span style="font-size:13px">'+esc(c.consult.qrTip)+'</span></div>';
    v.channels.forEach(function(ch){o+=chanBtn(ch,true);});
    o+='</div></div>';
  }
  if(v.sheet.ctrip){
    var b=v.book;
    o+='<div class="overlay"><button '+h(v.closeSheet)+' aria-label="'+esc(c.common.close)+'" style="position:absolute;inset:0;border:0;background:transparent;cursor:default"></button><div class="sheet" role="dialog" aria-modal="true"><div style="display:flex;align-items:center"><span style="flex-grow:1;font-size:20px;font-weight:700">'+esc(c.ctrip.title)+'</span><button class="x" '+h(v.closeSheet)+' aria-label="'+esc(c.common.close)+'">×</button></div>';
    o+='<div style="background:#F4F6F9;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px"><span style="font-weight:500">'+esc(b.title)+'</span><span style="font-size:14px;font-weight:700;color:#0A3F8C">'+esc(c.detail.code)+' '+esc(b.code)+'</span><span class="mt">'+esc(c.ctrip.check)+'</span></div>';
    c.ctrip.points.forEach(function(p){o+='<span style="font-size:13px">✓ '+esc(p)+'</span>';});
    o+='<a href="'+esc(v.ctripUrl)+'" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:#C24E00;color:#fff;font-size:15px;font-weight:500">'+esc(c.ctrip.go)+'</a>';
    o+='<div style="display:flex;gap:10px"><button '+h(v.copyLink)+' style="flex:1;height:44px;border:1px solid #0A3F8C;background:#fff;color:#0A3F8C;border-radius:22px">'+esc(c.ctrip.copy)+'</button><button class="gr" '+h(v.openConsult)+' style="flex:1;height:44px;border:0;color:#fff;border-radius:22px">'+esc(c.ctrip.ask)+'</button></div><span style="font-size:12px;background:#FFF6EE;border-radius:8px;padding:10px 12px">'+esc(c.ctrip.tip)+'</span></div></div>';
  }
  if(v.hasToast){o+='<div role="status" style="position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#1A2433;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;max-width:86vw;text-align:center">'+esc(v.toast)+'</div>';}
  document.getElementById('app').innerHTML=o;
  app._v=v;
}

var root=document.getElementById('app');
root.addEventListener('click',function(e){var el=e.target.closest('[data-h]');if(!el)return;var f=H[+el.getAttribute('data-h')];if(f)f(e);});
root.addEventListener('change',function(e){var t=e.target;if(t.matches('[data-sel="lang"]'))app._v.onLang(e);else if(t.matches('[data-sel="cur"]'))app._v.onCur(e);});
root.addEventListener('input',function(e){var t=e.target,k=t.getAttribute('data-field');if(!k)return;app.state.f[k]=t.type==='checkbox'?t.checked:t.value;});
root.addEventListener('change',function(e){var t=e.target,k=t.getAttribute('data-field');if(k&&t.type==='checkbox')app.state.f[k]=t.checked;});
root.addEventListener('submit',function(e){if(e.target.matches('[data-submit]')){e.preventDefault();app._v.submitForm(e);}});
render();
</script>
</body>
</html>
